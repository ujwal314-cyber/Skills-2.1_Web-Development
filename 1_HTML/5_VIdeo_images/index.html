<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video and Audio</title>
</head>
<body>
    <h1>Videos</h1>
    <ol type="i">
        <li><video src="" alt="v1" controls autoplay loop muted poster="poster.png" height="196"></video></li>
        <li><video src="" alt="v2" controls ></video></li>
        <li><video src="" alt="v3" controls ></video></li>
        <li><video src="" alt="v4" controls ></video></li>
        <li><video src="" alt="v5" controls ></video></li>
        <li><video src="" alt="v6" controls ></video></li>
    </ol>

    <h1>Audios</h1>
    <ol>
        <li><audio src="" alt="a1" controls preload="auto"></audio></li><!--preload attribute its default value is none it can be set to metadata or auto-->
        <li><audio src="" alt="a2" controls></audio></li>
        <li><audio src="" alt="a3" controls></audio></li>
        <li><audio src="" alt="a4" controls></audio></li>
        <li><audio src="" alt="a5" controls></audio></li>
        <li><audio src="" alt="a6" controls></audio></li>
    </ol>

    <svg height="200" width="200">
        <circle cx="90" cy="100" stroke="black" stroke-width="5" r="30" fill="red"/>
    </svg>

    <svg height="200" width="200">
        <circle cx="90" cy="100" stroke="black" stroke-width="5" r="50" fill="blue"/>
     </svg>

    <!--Video audio images and svgs are inline elements-->

    <iframe src="https://www.amazon.in" height="200" width="300"></iframe>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/XZwBNDGuWGU?si=oZU-F0TDcIUGRuLb" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inline and Block</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <p>A block element is the one which takes the entire width</p>
    <p>Which means that if the para is cooured then it will be coloured for the entire width</p>

    <a href="https://google.com">Google</a><!--Anchor is a inline element which means that it takes space only how much it is there-->

    <!--A block element will always come in a new line as it requires etire width-->
    <div>It is a block element</div>

    <!--A inline element continues will come in the same line if the previous element wasnt a block elment-->
    <a href="https://youtube.com">YouTube</a>
    <span>It is a inline elment</span>
    <a href="">Demo</a>

    <!--Inline and block elements can be interchanged in css-->
</body>
</html>

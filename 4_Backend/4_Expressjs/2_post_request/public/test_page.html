<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Post Request</title>
</head>
<body>
    <script>
        async function testPost() {
            let a=await fetch('/',{method:'POST'})
            let b=await a.text()
            console.log(b);
        }
        testPost()
    </script>
</body>
</html>



<!-- The **HTML is sending the POST request**, not receiving it.

Flow:

1. Browser loads `test_page.html`.
2. `fetch('/', { method: 'POST' })` sends a POST request to the server.
3. Express receives it in:

```js
app.post('/', (req, res) => {
    res.send("Hey this is a post request")
})
```

4. The server sends back `"Hey this is a post request"`.
5. The HTML receives the response:

```js
let a = await fetch('/', { method: 'POST' })
let b = await a.text()
console.log(b)
```

So:

```text
HTML (fetch)  ---> POST Request ---> Express Server

HTML (fetch)  <--- Response ------- Express Server
```

The POST request is **created by the HTML/JavaScript**, and `main.js` **handles it and sends a response back**. -->

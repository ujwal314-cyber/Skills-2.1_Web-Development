<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filters</title>
    <style>
        .img1{
            filter:contrast(4)
        }
        .img2{
            filter: invert(1);
        }
        .img3{
            filter: opacity(50%);
        }
    </style>
</head>
<body>
    <div class="img1">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQA-7UIYLcEK1mAwct1XgW8aSMnvm3ZEQBYgQ&s" alt="">
    </div>
    <div class="img2">
        <img src="https://i.pinimg.com/736x/2d/95/e5/2d95e5886fc4c65a6778b5fee94a7d59.jpg" alt="">
    </div>
    <div class="img3">
        <img src="https://www.planetware.com/img/gallery/canadas-14-best-destinations-to-snap-beautiful-pictures/intro-1762792954.jpg" alt="">
    </div>
</body>
</html>

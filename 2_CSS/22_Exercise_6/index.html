<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Template</title>
    <style>
        nav {
            display: flex;
            justify-content: space-around;

        }

        .logo img {
            height: 50px;

        }

        nav ul {
            display: flex;
            list-style: none;
            justify-self: right;
            align-items: center;
        }

        nav ul li {
            margin: 0px 20px;
            display: flex;
            align-items: center;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            font-size: 12px;
            cursor: pointer;
        }



        nav ul img {
            height: 20px;
            align-self: center;
        }
    </style>
</head>

<body>
    <nav>
        <div class="logo">
            <img src="https://www.ultraedit.com/wp-content/uploads/2023/01/UE_Site-Logo-1.png" alt="">
        </div>
        <div class="content">
            <ul>
                <li><span>Products </span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14"
                        height="14" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                    </svg></li>
                <li><span>Pricing</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14"
                        height="14" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                    </svg></li>
                <li><span>Resourses</span> <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14"
                        height="14" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                    </svg></li>
                <li><span>About Us</span><svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="14"
                        height="14" color="currentColor" fill="none" stroke="currentColor" stroke-width="1.5"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M18 9.00005C18 9.00005 13.5811 15 12 15C10.4188 15 6 9 6 9" />
                    </svg></li>
                <li><img src="https://w7.pngwing.com/pngs/498/901/png-transparent-google-translate-translation-google-search-android-android-english-text-logo.png"
                        alt="image.png" class="i2"></li>
            </ul>
        </div>
    </nav>
</body>

</html>

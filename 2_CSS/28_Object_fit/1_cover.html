<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover</title>
    <style>
        .container{
            width: 560px;
            height: 500px;
            border: 2px solid;
            background-color: aquamarine;
        }
        img{
            height: 466px;
            width: 466px;
            /* object-fit: cover; THis zooms the image so that it covers the mentioned height and width without changing the aspect ratio */
            object-fit: cover;
            object-position: top right;

        
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQA-7UIYLcEK1mAwct1XgW8aSMnvm3ZEQBYgQ&s" alt="">
    </div>
</body>
</html>

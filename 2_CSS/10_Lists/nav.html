<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* nav ul{
            list-style: none;
            display: flex;
            padding: 5px;
        } 
            > Here padding will be applied to entire ul as a whole not to each li element so as a result there will be no individual padding between the li elements hence no space between the elements*/
        *{
            margin: 0;
            padding: 0;
        }
        nav ul {
            list-style: none;
            display: flex;
        }

        nav ul li {
            padding: 5px;
        }
    </style>
</head>

<body>
    <nav>
        <ul>
            <li>Home</li>
            <li>About</li>
            <li>User</li>
        </ul>
    </nav>
</body>

</html>

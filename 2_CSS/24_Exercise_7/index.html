<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UltraEdit</title>
    <style>

        .container{
            padding: 20px;
            margin-top: 10vh;
            display: grid;
            place-self: center;
            grid-template-columns: 1fr;
            gap: 20px;
        }
  
        .item{
            padding: 10px;
            font-size: 20px;
            text-align: center;
            width: 260px;
            height: 100px;
            background-color: rgba(154, 153, 153, 0.16);
        }

        button{
            display: inline-block;
            margin-top: 43px;
            border: none;
        }

        @media screen and (min-width: 700px){
            .container{
                grid-template-columns: 1fr 1fr;
            }  
        }

        @media screen and (min-width:900px){
            .container{
                grid-template-columns: 1fr 1fr 1fr;
            }  
        }
        
        a{
            cursor: pointer;
            text-decoration: none;
            
            padding: 8px;
            margin: -5px;
            font-weight: bold;
            color: white;
            border-radius: 7px;  
        }

        .name{
            font-size: 17px;
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
            font-weight: bold;
            margin-top: 4px;
        }

        .c1{
            background-color: rgb(65, 198, 198);
        }
        
        .c2{
            background-color: rgb(31, 177, 55);
        }
    </style>
</head>
<body>

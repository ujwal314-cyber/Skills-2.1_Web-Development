<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container {
            width: 80vw;
            height: 80vh;
            background-color: antiquewhite;
        }
        
        .box {
            width: 80px;
            height: 50px;
            background-color: aquamarine;

            /* animation: name duration timing-function delay iteration-count direction fill-mode; */

            animation: MyAnimation;
            animation-duration: 3s;
            animation-timing-function: ease-in-out;
            animation-delay: 1s;
            animation-iteration-count: 1;
            animation-direction:normal;

            /* animation-direction: alternate-reverse; */

            /* animation-play-state: paused;you can pause or run the animation using js */

            animation-fill-mode: backwards;/*if forwards then the element stays at its final position only if backwards then it will come back to its first position*/

            animation: MyAnimation 3s ease-in-out 1s 1 , Rotate 3s ease-in-out 1s 1;/*Applying two animations at once*/
        }

        @keyframes MyAnimation {
            from {
                background-color: blue;
            }

            to {
                transform: translateX(30vw) translateY(30vh) scale(2);
                background-color: brown;
            }
        }
        @keyframes Rotate {
            0%{ transform: rotate(10deg);}
            20%{transform: rotate(80deg);}
            40%{transform: rotate(100de)g;}
            60%{transform: rotate(180de)g;}
            80%{transform: rotate(200de)g;}
            100%{transform: rotate(360de)g;}
            
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="box"></div>
    </div>
</body>

</html>

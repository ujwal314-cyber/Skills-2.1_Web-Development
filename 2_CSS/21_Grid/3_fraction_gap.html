<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Area</title>
    <style>
        .container{
            border: 3px solid brown;
            padding: 10px;
            display: grid;

            width: 80vw;
            height: 80vh;
            grid-template-columns: 1fr 3fr 1fr ;/*Divide the  coloumns in the ratio of 1 fraction 3 fraction and 1 fraction*/
            /* grid-template-rows: repeat(2,1fr);is same as the below one repeats two times 1fr */
            /* grid-template-rows: 1fr 1fr; */

            grid-template-rows: repeat(2,minmax(100px,1fr));/*repeats 2 times the minmax which specifies that the minimum width should be 100px amd max should be 1fr*/

            gap: 34px;
            row-gap: 34px;/*row and column gaps can be set separately but here there is no change as their values match to the already applied gap 
            
            > gap is applied only between the items not the item and the container*/
            column-gap: 34px;

            /* justify-content: center do not use this; 
            as the justify content will be applied on the entire grid 
            > if at all the grid is smaller than the container and you apply justify content centre then the entire grid will be in the center of the container
            > same applies to align content*/

            /* justify-items: center;
            align-items: center; 
            
            both can be applied at once using place-items
            
            > same applies to content -> place-contents*/

            place-items: center;
        }

        .item{
            border: 2px solid chocolate;
            height: 50px;
            width: 50px;
        }

        .i2{
            align-self: start;
            justify-self: end;/*these are applied with respect to that particular cell not the entire grid */
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item i1">1</div>
        <div class="item i2">2</div>
        <div class="item i3">3</div>
        <div class="item i4">4</div>
        <div class="item i5">5</div>
    </div>
</body>
</html>

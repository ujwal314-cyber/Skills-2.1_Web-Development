<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Colours</title>
    <style>
        *{
            background-color: rgb(53, 53, 53);
            color: azure;
            border: 2px solid white;
            text-align: center;
        }
        h1{
            color: bisque;
        }
        #l1{
            background-color: brown;
        }
        #l2{
            background-color: #76DEA1;
        }
        #l3{
            background-color: rgb(150, 39, 184);
        }
        #l4{
            background-color: rgba(139, 60, 31, 0.699);
        }
        #l5{
            background-color: hsl(174, 56%, 27%);
        }
        #l6{
            background-color: hsla(0, 56%, 27%, 0.6) ;
        }
        
    </style>

</head>
<body>
    <h1>Colours</h1>
    <h2>
        Colours can be represented as
    </h2>
    <p>
        <ol>
            <li id="l1">Color Keywords </li>
            <li id="l2">Hex Color code </li>
            <li id="l3">RGB </li>
            <li id="l4">RGBA </li>
            <li id="l5">HSL</li>
            <li id="l6">HSLA</li>
        </ol>
    </p>
</body>
</html>

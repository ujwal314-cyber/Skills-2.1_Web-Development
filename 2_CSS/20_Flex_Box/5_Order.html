<!DOCTYPE html>

    <title>Gap</title>
    <style>
        .container{
            height: 80vh;
            margin: 20px;
            border: 2px solid darkred;
            display: flex;
            justify-content: center;
            align-content: center;
            flex-wrap: wrap;
        }

        .item{
            text-align: center;
            align-content: center;
            height: 40px;
            width: 40px;
            border: 2px solid;
            background-color: aquamarine;
            margin: 2px;
        }

        .o1{
            order: 1;
        }/*order is a item property the item with more order will appear at the last and with least order at the first
        
        > This property can be used to change the order of the elements
        
        > default order is 0*/

        .o2{
            order: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item o2">1</div>
        <div class="item">2</div>

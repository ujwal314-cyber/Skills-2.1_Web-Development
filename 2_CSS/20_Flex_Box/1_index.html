<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Box</title>
    <style>
        .container{
            height: 80vh;
            margin: 20px;
            border: 2px solid darkred;
            display: flex;/*Flex box is applied to the container not to the individual items*/
            justify-content: center;/*Main axis centre*/
            align-items: center;/*Vertical center*/

        }

        .item{
            height: 40px;
            width: 40px;
            border: 2px solid;
            background-color: aquamarine;
            margin: 2px;
        }

        .c2{
            justify-content: flex-end;
        }

        .c3{
            justify-content: flex-start;
        }
        .c4{
            justify-content: space-around;
        }
        .c5{
            justify-content: space-between;
        }
        .c6{
            align-items: baseline;/*Will be on one line*/
        }
    </style>
</head>
<body>
    <main>
        <div class="container">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container c2">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container c3">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container c4">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container c5">
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
            <div class="item"></div>
        </div>
        <div class="container c6">
            <div class="item" style="height: 90px; width: 90px;"></div>
            <div class="item" style="height: 30px; width: 30px;"></div>
            <div class="item" style="height: 200px; width: 200px;"></div>
            <div class="item""></div>
        </div>
    </main>
</body>
</html>

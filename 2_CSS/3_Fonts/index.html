<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fonts</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quintessential&display=swap');
        h1{
            font-family: 'Gill Sans', 'Gill Sans MT', Calibri, 'Trebuchet MS', sans-serif;
        }
        p{
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; /*here a set of fonts arre used so that if the fonts are not available in the users device then the next font will be applied*/

            font-style: italic;
            line-height: 5;
        
        }
        #t2{
            font-family: "Quintessential", serif;
            font-style: normal;
            font-weight: 500;
            font-size: 20px;
            text-decoration: underline;
        }

        #t3{
            text-decoration: overline;
        }

        #t4{
            letter-spacing: 4px;
        }

        h2{
            text-transform: capitalize;
            /* text-transform: uppercase; */
            text-decoration: underline;
            text-decoration-color: blue;
            text-decoration-style:wavy ;
            text-decoration-thickness: 5px;
            text-indent: 23px;
            text-align:center;
        }

        #lorem{
            line-height: normal;
            width: 50px;height: 500px;
            border: 3px solid green;
            text-overflow:ellipsis;
            overflow:hidden;
            /* word-break: break-all; */
            text-align:center;

        }
    </style>
</head>
<body>
    <h1>Fonts</h1>
    <p>This is a font</p>
    <p id="t2">This is a font</p>
    <p id="t3">This is a font</p>
    <p id="t4">This is a font</p>

    <h2>transform</h2>

    <p id="lorem">Lorem ipsum dolor sit amet consectetur adipisicing elit. Laboriosam officia ab facilis recusandae laborum, eligendi sed cum blanditiis voluptatem commodi aut excepturi omnis?</p>
</body>
</html>

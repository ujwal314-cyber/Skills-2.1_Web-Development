<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Anonymous+Pro:ital,wght@0,400;0,700;1,400;1,700&family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&display=swap');
        
        body{
            overflow: hidden;
            background-color: rgb(0, 0, 0);
            position: relative;
            color: rgb(0, 255, 0);
            font-family: "Anonymous Pro", monospace;
        }

         .count{
            display: flex;
            position: absolute;     
            top: 50%;               
            left: 50%;              
            transform: translate(-50%, -50%);
            z-index: 2;            /* Below the image (image is z-index: 3) */
            justify-content: center;
            align-items: center;
            font-size: 400px;
        }

        .cont{
            position: absolute;
            z-index: 1;
        }

        .img{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            width: 100vw;
            margin: 0;
            padding: 0;
            filter: opacity(0.5);
            overflow: hidden;
        }
        .img img{
            position: relative;
            z-index: 3;
            height: 100%;
            width: 100%;
            object-fit: contain;
            object-position: center;
           
            
        }


        
    </style>
</head>
<body>
    <div class="cont">
        <div class="c_1"></div>
        <div class="c_2"></div>
        <div class="c_3"></div>
        <div class="c_4"></div>
    </div>
    <div class="count"></div>
    <div class="img">
    </div>
        <script src="script.js"></script>
</body>
</html>

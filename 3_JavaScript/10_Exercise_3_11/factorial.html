<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        let n = prompt("Enter a number: ");

        let a = 1;
        for (let i = 1; i <= n; i++) {
            a *= i;
        }

        // alert("The factorial is", a); this doesnt print a
        alert(`The factorial is ${a}`)
        console.log(a)
    </script>
</body>

</html>

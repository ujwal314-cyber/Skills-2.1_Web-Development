<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DOM</title>
</head>

<body>
    <div class="box">
        DOM - stands for Document Object Model
    </div>
    <script>
        document.title="Title"//This will be displayed instead of the DOM once the js is executed
        console.log(document.title);
        console.log(document.body);
        document.body.style.backgroundColor="green";//This will add a inline css to the page
    </script>
</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thumbnail</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        .container {
            width: 98vw;
            height: 160px;
            background-color: rgb(0, 0, 0);
            display: flex;
            margin: 1vw;
            padding:20px 20px ;
            border-radius: 10px;
            color: rgba(255, 255, 255, 0.948);
            font-family: Roboto,"Arial",sans-serif;
        }

        .img {
            display: flex;
            width: 200px;
            align-self: center;
            position: relative;
        }
        
        img{
            width: 200px;
            border-radius: 10px;
            align-self: flex-end;
        }

        .content {
            display: inline-block;
            width: 85%;
            /* background-color: rgb(188, 27, 27); */
            padding: 0px 10px;
            margin: 7px 2px;   
            color: rgba(255, 255, 255, 0.948);
            font-family: Roboto,"Arial",sans-serif;
        }

        .title{
            font-size:x-large;
            font-weight: bold;
        }
        
        .extra{
            margin-top: 15px;
            color: rgba(255, 255, 255, 0.49);
        }

        .dot{
            display: inline-block;
            border-radius: 30%;
            height: 3px;
            width: 3px;
            background-color: rgba(255, 255, 255, 0.49);
            margin: 0px 3px 3px 3px;
        }

        .timestamp{
            background-color: rgba(0, 0, 0, 0.737);
            position: absolute;
            bottom: 5px;
            right: 5px;
            padding: 3px;
            font-size: small;
            border-radius: 5px;
        }
    </style>

</head>

<body>
    <div class="container">
        <div class="img">
            <img src="Thumbnail.png" alt="image.png">
            <div class="timestamp">00:00</div>
        </div>
        <div class="content">
            <div class="title">
                Title
            </div>

            <div class="extra">
                <span class="cname">Channel Name</span>

                <span><div class="dot"></div></span>

                <span class="views">N views</span>

                <span><div class="dot"></div></span>

                <span class="date">days ago</span>
            </div>

        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
